[package]
name = "atuin-share"
edition = "2024"
description = "Experimental terminal sharing for atuin (atuin lab share)"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

# Only what the unconditional modules (`error`, the `run_share` stubs) need;
# everything else is unix-only, matching the `cfg(unix)` module tree.
[dependencies]
thiserror = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
serde_json = { workspace = true }
base64 = { workspace = true }
atuin-common = { workspace = true, features = ["unicode"] }
vt100 = { workspace = true }
crossterm = { workspace = true }
# `features = ["full"]` at the workspace level includes `signal` and `time`;
# trimming to just what this crate needs would be a workspace change.
tokio = { workspace = true }
# Crate-local pins below: the workspace manifest is out of scope for this
# refactor, so they cannot move to [workspace.dependencies] yet.
portable-pty = "0.9"                                                            # PTY + child process
unicode-width = "0.2"                                                           # status-bar display-width math
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] } # hub WebSocket
futures-util = "0.3"                                                            # stream/sink split of the WebSocket
