[package]
name = "atuin-client"
edition = "2024"
description = "client library for atuin"
autobenches = false

authors.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["sync", "hub", "daemon"]
sync = ["reqwest", "dep:reqwest-middleware"]
hub = ["reqwest"]
daemon = []
check-update = []
# Statically link (vendor) OpenSSL for native-tls instead of using the system
# libssl. Used for portable release artifacts; a no-op on macOS/Windows.
vendored-tls = ["reqwest?/native-tls-vendored"]

[dependencies]
atuin-common = { workspace = true, features = ["os", "sqlite"] }
atuin-domain = { workspace = true }

async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
derive_more = { workspace = true }
directories = { workspace = true }
easy-cast = { workspace = true }
enum_dispatch = { workspace = true }
eyre = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
interim = { workspace = true }
itertools = { workspace = true }
libsqlite3-sys = { workspace = true }
memchr = { workspace = true }
minspan = { workspace = true }
notify = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_regex = { workspace = true }
serde_with = { workspace = true }
shellexpand = { workspace = true }
sql-builder = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "regexp"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["macros", "formatting", "parsing"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-futures = { workspace = true }
typed-builder = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
whoami = { workspace = true }
zeroize = { workspace = true }

# encryption
rusty_paserk = { workspace = true }
rusty_paseto = { workspace = true }

# sync
indicatif = { workspace = true }
reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true, features = ["json", "query"] }
tiny-bip39 = { workspace = true }

# theme
crossterm = { workspace = true, features = ["serde"] }
palette = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

# packfile
zstd = { workspace = true }
serde_bytes = { workspace = true }

[dev-dependencies]
# This crate's tests require the `test-utils` feature in atuin-common.
atuin-common = { workspace = true, features = ["test-utils"] }
divan = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
wiremock = { workspace = true }

[[bench]]
name = "benchmarks"
harness = false

[lints]
workspace = true
