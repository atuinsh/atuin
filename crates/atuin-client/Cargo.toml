[package]
name = "atuin-client"
edition = "2024"
description = "client library for atuin"
autobenches = false

rust-version = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["sync", "hub", "daemon"]
sync = ["reqwest"]
hub = ["reqwest"]
daemon = []
check-update = []
# Statically link (vendor) OpenSSL for native-tls instead of using the system
# libssl. Used for portable release artifacts; a no-op on macOS/Windows.
vendored-tls = ["reqwest?/native-tls-vendored"]

[dependencies]
derive_more = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
time = { workspace = true, features = ["macros", "formatting", "parsing"] }
clap = { workspace = true }
eyre = { workspace = true }
directories = { workspace = true }
uuid = { workspace = true }
whoami = { workspace = true }
interim = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
humantime = "2.1.0"
enum_dispatch = { workspace = true }
async-trait = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true }
shellexpand = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "regexp"] }
minspan = "0.1.5"
regex = { workspace = true }
serde_regex = "1.1.0"
fs-err = { workspace = true }
sql-builder = { workspace = true }
memchr = "2.7"
rmp = { version = "0.8.14" }
typed-builder = { workspace = true }
tokio = { workspace = true }
semver = { workspace = true }
thiserror = { workspace = true }
futures = "0.3"
notify = "8"
crypto_secretbox = "0.1.1"
serde_with = "3.8.1"

# encryption
rusty_paseto = { version = "0.8.0", default-features = false }
rusty_paserk = { version = "0.5.0", default-features = false, features = [
  "v4",
  "serde",
] }

# sync
reqwest = { workspace = true, optional = true }
indicatif = "0.18.0"
tiny-bip39 = "2.0.0"

# theme
crossterm = { workspace = true, features = ["serde"] }
palette = { version = "0.7.5", features = ["serializing"] }
strum_macros = "0.27"
strum = { version = "0.27", features = ["strum_macros"] }

[dependencies.atuin-common]
path = "../atuin-common"
version = "18.19.0-beta.3"

[dependencies.atuin-domain]
path = "../atuin-domain"
version = "18.19.0-beta.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
tempfile = "3"
toml = "1.1"

# This crate's tests require the `test-utils` feature in atuin-common.
[dev-dependencies.atuin-common]
path = "../atuin-common"
version = "18.19.0-beta.3"
features = ["test-utils"]

[[bench]]
name = "benchmarks"
harness = false
