[package]
name = "atuin"
edition = "2024"
description = "atuin - magical shell history"
readme = "./README.md"

authors.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

exclude = ["vendor/bash-preexec/.github", "vendor/bash-preexec/test"]

[[bin]]
name = "atuin"
path = "src/main.rs"

# The helper that reads the desktop for the daemon. It is a binary of its own so that the macOS
# Accessibility permission covers only code that reads the desktop.
[[bin]]
name = "atuin-desktop-capture"
path = "src/bin/atuin-desktop-capture/main.rs"
required-features = ["desktop-capture"]
# The library `atuin-desktop-capture` has the same crate name, and its documentation would share
# the helper's directory.
doc = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.deb]
maintainer = "Ellie Huxtable <ellie@elliehuxtable.com>"
copyright = "2021, Ellie Huxtable <ellie@elliehuxtable.com>"
license-file = ["LICENSE"]
depends = "$auto"
section = "utility"

[package.metadata.rpm]
package = "atuin"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
atuin = { path = "/usr/bin/atuin" }

[package.metadata.wix]
upgrade-guid = "313BC66B-8878-40FC-9042-45A787D28E7B"
path-guid = "93A1B211-BC0F-4942-81E4-6F6CAA9C25F1"
license = "LICENSE"
eula = false

[features]
default = [
    "client",
    "sync",
    "check-update",
    "daemon",
    "ai",
    "pty-proxy",
    "octavo",
]
client = ["atuin-client"]
sync = ["atuin-client/sync"]
daemon = ["dep:async-stream", "atuin-client/daemon", "atuin-daemon"]
ai = ["atuin-ai", "atuin-client/ai", "atuin-common/ai", "atuin-daemon?/ai"]
pty-proxy = ["dep:atuin-pty-proxy"]
# Desktop capture: the `atuin-desktop-capture` helper, the daemon that runs it, the
# `desktop-capture` subcommand, its parts of `atuin setup` and `atuin doctor`, and the
# `atuin_desktop_*` MCP tools.
desktop-capture = [
    "daemon",
    "atuin-common/rmp-frame",
    "dep:atuin-desktop-capture",
    "atuin-desktop-capture/platform",
    "atuin-daemon/desktop-capture",
    "atuin-ai?/desktop-capture",
    "dep:tokio-util",
    "dep:toml",
]
# Compiled in, but nothing reaches Atuin Hub until the user's own atuin.lua sets
# `upload.threads`, which `atuin setup --hub` writes.
octavo = [
    "ai",
    "sync",
    "daemon",
    "atuin-client/octavo",
    "atuin-daemon/octavo",
    "atuin-domain/octavo",
    "dep:atuin-octavo",
]
hex = ["pty-proxy"]
check-update = ["atuin-client/check-update"]
vendored-tls = ["atuin-client?/vendored-tls"]
# `atuin update`: self-update via the cargo-dist install receipt. Not a
# default feature: only the official installer artifacts can self-update
# (dist enables it in dist-workspace.toml), so package-manager and
# `cargo install` builds skip axoupdater and its dependency tree — notably
# axoasset's rustls/aws-lc-rs reqwest backend, which is only avoided by the
# [patch.crates-io] axoasset fork when building from this repo.
self-update = ["dep:axoupdater"]
profiling-traced = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
atuin-ai = { workspace = true, optional = true }
# TODO(taylordotfish): in Rust 1.99 we can change this to `workspace = true`
# Keep inline tables on one line: i18n-embed-fl's `fl!` parses this manifest
# with a TOML 1.0 parser (find-crate -> toml 0.5).
atuin-client = { path = "../atuin-client", version = "18.25.1", optional = true, default-features = false }
atuin-common = { workspace = true, features = ["cli-reference", "db", "os", "unicode"] }
atuin-daemon = { workspace = true, optional = true }
atuin-desktop-capture = { workspace = true, optional = true, features = ["link"] }
atuin-domain = { workspace = true }
atuin-dotfiles = { workspace = true }
atuin-history = { workspace = true }
atuin-vt100 = { workspace = true }
atuin-kv = { workspace = true }
atuin-octavo = { workspace = true, optional = true }
atuin-pty-proxy = { workspace = true, optional = true }
atuin-scripts = { workspace = true }

ansi-to-tui = { workspace = true }
async-stream = { workspace = true, optional = true }
async-trait = { workspace = true }
axoupdater = { workspace = true, optional = true }
clap = { workspace = true }
clap-couture = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
colored = { workspace = true }
const_format = { workspace = true }
crossterm = { workspace = true, features = ["use-dev-tty"] }
derive_more = { workspace = true }
easy-cast = { workspace = true }
enum_dispatch = { workspace = true }
enumset = { workspace = true }
eyre = { workspace = true }
frizbee = { workspace = true }
futures-util = { workspace = true }
i18n-embed = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
jiff = { workspace = true }
locked-tripwire = { workspace = true }
norm = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
rand = { workspace = true }
ratatui = { workspace = true }
regex = { workspace = true }
rpassword = { workspace = true }
runtime-format = { workspace = true }
rust-embed = { workspace = true }
rustix = { workspace = true }
secrecy = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tiny-bip39 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# settings editor with comment and relative ordering preservation
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

# Enable tree-sitter shell parsing on platforms where tree-sitter's bundled C
# compiles cleanly. tree-sitter 0.26's portable/endian.h fails on illumos,
# Windows cross-compiles, and potentially other exotic targets.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "illumos"))'.dependencies]
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-fish = { workspace = true }
tree-sitter-powershell = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
atuin-common = { workspace = true, features = ["test-utils"] }
atuin-desktop-capture = { workspace = true, features = ["test-support"] }
# An in-process sync server for the AI session e2e tests (tests/e2e_ai_sessions.rs).
atuin-server = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
# opencode keeps its sessions in SQLite: the e2e tests write one as it does.
rusqlite = { workspace = true }
# Kiro buckets its sessions by a SHA-256 of the working directory: the e2e tests write one as it does.
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }
# A fake daemon for the prompt hook's tests.
tonic = { workspace = true }

# for the PTY e2e tests (tests/e2e_pty.rs)
[target.'cfg(unix)'.dev-dependencies]
nix-pty = { package = "nix", version = "0.28", features = ["term"] }
portable-pty = "0.9"

[build-dependencies]
# build.rs reads the feature names from this manifest for `atuin doctor`.
toml_edit = { workspace = true }

[lints]
workspace = true
