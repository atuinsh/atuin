[package]
name = "atuin"
edition = "2024"
description = "atuin - magical shell history"
readme = "./README.md"

rust-version = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

exclude = ["vendor/bash-preexec/.github", "vendor/bash-preexec/test"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.deb]
maintainer = "Ellie Huxtable <ellie@elliehuxtable.com>"
copyright = "2021, Ellie Huxtable <ellie@elliehuxtable.com>"
license-file = ["LICENSE"]
depends = "$auto"
section = "utility"

[package.metadata.rpm]
package = "atuin"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
atuin = { path = "/usr/bin/atuin" }

[features]
default = [
    "client",
    "sync",
    "clipboard",
    "check-update",
    "daemon",
    "ai",
    "pty-proxy",
]
client = ["atuin-client"]
sync = ["atuin-client/sync"]
daemon = ["atuin-client/daemon", "atuin-daemon", "atuin-ai?/daemon"]
ai = ["atuin-ai"]
pty-proxy = ["dep:atuin-pty-proxy"]
hex = ["pty-proxy"]
clipboard = ["arboard"]
check-update = ["atuin-client/check-update"]
vendored-tls = ["atuin-client?/vendored-tls"]
# `atuin update`: self-update via the cargo-dist install receipt. Not a
# default feature: only the official installer artifacts can self-update
# (dist enables it in dist-workspace.toml), so package-manager and
# `cargo install` builds skip axoupdater and its dependency tree — notably
# axoasset's rustls/aws-lc-rs reqwest backend, which is only avoided by the
# [patch.crates-io] axoasset fork when building from this repo.
self-update = ["dep:axoupdater"]
profiling-traced = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
easy-cast = { workspace = true }
atuin-ai = { workspace = true, optional = true }
# default-features = false cannot be set on a workspace-inherited dependency, and
# atuin-client's defaults (sync/hub/daemon) are needed by its other consumers, so
# the workspace entry keeps them on. This crate opts out via a direct path dep.
atuin-client = { path = "../atuin-client", version = "18.21.0", optional = true, default-features = false }
atuin-common = { workspace = true, features = ["unicode", "os"] }
atuin-domain = { workspace = true }
atuin-dotfiles = { workspace = true }
atuin-history = { workspace = true }
atuin-daemon = { workspace = true, optional = true }
atuin-pty-proxy = { workspace = true, optional = true }
atuin-scripts = { workspace = true }
atuin-kv = { workspace = true }
axoupdater = { workspace = true, optional = true }
derive_more = { workspace = true }

time = { workspace = true }
eyre = { workspace = true }
url = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossterm = { workspace = true, features = ["use-dev-tty"] }
unicode-width = { workspace = true }
itertools = { workspace = true }
tokio = { workspace = true }
enum_dispatch = { workspace = true }
async-trait = { workspace = true }
interim = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_complete_nushell = { workspace = true }
rpassword = { workspace = true }
semver = { workspace = true }
rustix = { workspace = true }
runtime-format = { workspace = true }
tiny-bip39 = { workspace = true }
futures-util = { workspace = true }
colored = { workspace = true }
ratatui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
uuid = { workspace = true }
sysinfo = { workspace = true }
regex = { workspace = true }
norm = { workspace = true }
frizbee = { workspace = true }
tempfile = { workspace = true }
shlex = { workspace = true }
thiserror = { workspace = true }

# settings editor with comment and relative ordering preservation
toml_edit = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, optional = true, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }

# Enable tree-sitter shell parsing on platforms where tree-sitter's bundled C
# compiles cleanly. tree-sitter 0.26's portable/endian.h fails on illumos,
# Windows cross-compiles, and potentially other exotic targets.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "illumos"))'.dependencies]
atuin-ai = { workspace = true, optional = true, features = ["tree-sitter"] }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-fish = { workspace = true }
tree-sitter-powershell = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
