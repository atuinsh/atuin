syntax = "proto3";
package ai.session;

import "ai/agent.proto";
import "common.proto";

message ListSessionsRequest {
  optional ai.agent.HarnessKind harness = 1;
}

message ListSessionsResponse {
  repeated ai.agent.Session sessions = 1;
}

message GetSessionRequest {
  ai.agent.HarnessSession session = 1;
}

// Streamed by GetSession: the first event carries the session, and every event
// after it carries one message, in order.
message GetSessionEvent {
  oneof event {
    ai.agent.Session session = 1;
    ai.agent.Message message = 2;
  }
}

message GetTranscriptRequest {
  ai.agent.HarnessSession session = 1;
}

// One chunk of a rendered transcript. Concatenate `chunk`s in arrival order to
// reconstruct the whole transcript.
message GetTranscriptChunk {
  string chunk = 1;
}

message SearchSessionsRequest {
  string query = 1;
  // Maximum number of matches, most-relevant first. 0 means unbounded: results
  // stream lazily, so consume what you need and drop the stream.
  uint32 limit = 2;
  // Only search sessions from this harness. Absent searches every harness.
  optional ai.agent.HarnessKind harness = 3;
}

message SearchSessionsMatch {
  ai.agent.Session session = 1;
  common.HighlightedText title = 2;
  common.HighlightedText preview = 3;
  double score = 4;
}

// Which sessions to follow. An absent field is not a filter.
message TailSessionsRequest {
  // Only stream events for sessions from this harness. Absent follows every
  // harness.
  optional ai.agent.HarnessKind harness = 1;
}

message TailSessionsEvent {
  oneof event {
    // A new session was created.
    ai.agent.Session session_started = 1;
    // A session's summary changed (title, message_count, tokens, updated_at).
    ai.agent.Session session_updated = 2;
    // A message was recorded.
    ai.agent.Message message = 3;
    // The consumer fell behind the stream and events were dropped.
    common.Lagged lagged = 4;
  }
}

service AiSession {
  // List session summaries, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Fetch one session and its messages, streamed: the session first, then each
  // message in order. Streamed so a large session never has to fit in one
  // response.
  rpc GetSession(GetSessionRequest) returns (stream GetSessionEvent);

  // Render one session as a plain-text transcript, streamed in chunks.
  rpc GetTranscript(GetTranscriptRequest) returns (stream GetTranscriptChunk);

  // Fuzzy-search sessions, streamed most-relevant-first.
  rpc SearchSessions(SearchSessionsRequest) returns (stream SearchSessionsMatch);

  // Follow sessions and messages as they are recorded.
  rpc TailSessions(TailSessionsRequest) returns (stream TailSessionsEvent);
}
