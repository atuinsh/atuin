// Octavo thread sharing state from the local upload queue, and thread links and labels.
syntax = "proto3";

package octavo;

import "ai/agent.proto";

// Whether the daemon uploads threads to Octavo.
enum Upload {
  UPLOAD_UNSPECIFIED = 0;
  // Octavo is disabled in settings, or the daemon was built without it.
  UPLOAD_OFF = 1;
  // Not logged in to Atuin Hub.
  UPLOAD_LOGGED_OUT = 2;
  UPLOAD_ON = 3;
}

// Lifecycle state of a thread's share with an organization.
enum ShareState {
  SHARE_STATE_UNSPECIFIED = 0;
  // Queued to be opened.
  SHARE_STATE_OPENING = 1;
  SHARE_STATE_OPEN = 2;
  // Queued to be closed.
  SHARE_STATE_CLOSING = 3;
  // Closed permanently.
  SHARE_STATE_CLOSED = 4;
}

// An organization a thread is shared with and its share state.
message OrgShare {
  string org_slug = 1;
  ShareState state = 2;
}

// A directory a thread uploaded messages from and the organizations configured for it.
// A thread stays shared only with organizations allowed by every directory it ran in.
message DirShares {
  string dir = 1;
  repeated string org_slugs = 2;
}

message ThreadRequest {
  ai.agent.HarnessSession thread = 1;
}

message ThreadShares {
  Upload upload = 1;
  // Empty unless `upload` is `UPLOAD_ON` and at least one message has been uploaded.
  repeated OrgShare orgs = 2;
  repeated DirShares dirs = 3;
  // Whether the user made the thread private; no config shares it again.
  bool is_private = 4;
  // Whether a private thread's share links are still queued to be revoked.
  bool revoking_links = 5;
}

message ShareLinkReply {
  // The link's URL on the hub's web app.
  string url = 1;
}

message AddLabelsRequest {
  ai.agent.HarnessSession thread = 1;
  // A name the user has no label of creates one.
  repeated string names = 2;
}

message AddLabelsReply {
  // Names of all the thread's labels.
  repeated string names = 1;
}

message ThreadStartedRequest {
  ai.agent.HarnessSession thread = 1;
  // The directory the agent started the thread in.
  string dir = 2;
}

message ThreadStartedReply {}

message NewThreadRequest {
  // The thread's session id, as its agent names it.
  string session_id = 1;
}

service Threads {
  // Get the organizations a thread is shared with and the directories that determine them.
  rpc GetShares(ThreadRequest) returns (ThreadShares);
  // Close the thread to every organization it's shared with, revoke its share links and keep it
  // private.
  rpc MakePrivate(ThreadRequest) returns (ThreadShares);
  // Get a link that opens the thread to anyone holding it, creating a link-only share if no share
  // of it has one.
  rpc ShareLink(ThreadRequest) returns (ShareLinkReply);
  // Add labels to the thread by name, keeping those it has.
  rpc AddLabels(AddLabelsRequest) returns (AddLabelsReply);
  // Hear that an agent started a thread in a directory, before any message of it is captured.
  rpc ThreadStarted(ThreadStartedRequest) returns (ThreadStartedReply);
  // Get who a thread an agent started lately will be shared with once its first message is
  // captured: the organizations its directory's config shares with, as opening. NOT_FOUND when
  // no agent started one by that id lately.
  rpc GetNewThreadShares(NewThreadRequest) returns (ThreadShares);
}
