// Shared protobuf utilities used across atuin's code.
syntax = "proto3";

package common;

// A UUID, carried as its 16 raw bytes.
message Uuid {
  bytes value = 1;
}

// Identifies a single record in the record store. Wraps the generic Uuid so it stays a distinct
// type from other id kinds (e.g. a history entry's id) while sharing the same wire representation.
message RecordId {
  Uuid uuid = 1;
}
