syntax = "proto3";
package search;

import "common.proto";

enum FilterMode {
  GLOBAL = 0;
  HOST = 1;
  SESSION = 2;
  DIRECTORY = 3;
  WORKSPACE = 4;
  SESSION_PRELOAD = 5;
}

message SearchContext {
  string session_id = 1;
  string cwd = 2;
  string hostname = 3;
  string host_id = 4;
  optional string git_root = 5;
}

message SearchRequest {
  string query = 1;
  uint64 query_id = 2; // Incrementing ID to match responses to queries
  FilterMode filter_mode = 3;
  SearchContext context = 4;
  repeated string shells = 5; // Which shells' commands to include
}

message SearchResponse {
  uint64 query_id = 1; // Echo back the query ID
  repeated bytes ids = 2;
}

// Tells the daemon to build the search index for the given list of shells.
// This message gets sent from the shell init scripts, to avoid a delay when
// the first search request is sent.
message PrepareIndexRequest {
  repeated string shells = 1;
}

message PrepareIndexResponse {}

// Full-text search over all captured command output.
message SearchCommandOutputRequest {
  string query = 1;
  uint32 limit = 2; // 0 means "use the server default".
}

// A single matching command output.
message OutputSearchMatch {
  // The history ID of the matching output.
  common.HistoryId history_id = 1;
  // The full visible (escape-stripped) output that was searched, so a client can show any match
  // in as much context as it likes without a second round trip.
  string output = 2;
  // Byte ranges into `output` covering each match. May be empty, or hold several.
  repeated common.UnsignedIdxRange matches = 3;
  // Relevance -- higher means more relevant.
  //
  // Don't depend on this in any other form except for sorting.
  double score = 4;
}

service Search {
  rpc Search(stream SearchRequest) returns (stream SearchResponse);
  rpc PrepareIndex(PrepareIndexRequest) returns (PrepareIndexResponse);

  // Search the pool of output commands for a matching history request.
  //
  // Returns the matches in a stream, ordered by relevancy -- most-relevant first.
  rpc SearchCommandOutput(SearchCommandOutputRequest) returns (stream OutputSearchMatch);
}
