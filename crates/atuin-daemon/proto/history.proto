syntax = "proto3";
package history;

import "common.proto";

// Identifies a single history entry. Wraps the generic common.Uuid so it stays a distinct type
// from other id kinds while sharing the same wire representation.
message HistoryId {
  common.Uuid uuid = 1;
}

// Whether a human or an agent ran a command. Unspecified means the caller did
// not say, and the author name is all the receiver has to go on. Unspecified is
// also what keeps this backwards compatible: it is proto3's zero value, so a
// peer from before this field existed reads and writes it implicitly.
enum AuthorKind {
  AUTHOR_KIND_UNSPECIFIED = 0;
  AUTHOR_KIND_USER = 1;
  AUTHOR_KIND_AGENT = 2;
}

message StartHistoryRequest {
  // If people are still using my software in ~530 years, they can figure out a u128 migration
  uint64 timestamp = 1; // nanosecond unix epoch
  string command = 2;
  string cwd = 3;
  string session = 4;
  string hostname = 5;
  string author = 6;
  string intent = 7;
  string shell = 8;
  AuthorKind author_kind = 9;
}

message EndHistoryRequest {
  HistoryId id = 1;
  int64 exit = 2;
  uint64 duration = 3;
}

// Cancel an in-progress history entry without adding it to the database.
message CancelHistoryRequest {
  HistoryId id = 1;
}

message StartHistoryReply {
  HistoryId id = 1;
  string version = 2;
  uint32 protocol = 3;
}

message EndHistoryReply {
  HistoryId id = 1;
  uint64 idx = 2;
  string version = 3;
  uint32 protocol = 4;
}

message CancelHistoryReply {
  string version = 1;
  uint32 protocol = 2;
}

message StatusRequest {}

message StatusReply {
  bool healthy = 1;
  string version = 2;
  uint32 pid = 3;
  uint32 protocol = 4;
}

message ShutdownRequest {}

message ShutdownReply {
  bool accepted = 1;
}

message TailHistoryRequest {}

enum HistoryEventKind {
  HISTORY_EVENT_KIND_UNSPECIFIED = 0;
  HISTORY_EVENT_KIND_STARTED = 1;
  HISTORY_EVENT_KIND_ENDED = 2;
  // The consumer fell behind and the daemon dropped events for it. This is an
  // in-band notice (not a terminating gRPC status), so the tail stream keeps
  // running. `history` is unset; `dropped` carries the number of lost events.
  HISTORY_EVENT_KIND_LAGGED = 3;
}

message HistoryEntry {
  uint64 timestamp = 1; // nanosecond unix epoch
  HistoryId id = 2;
  string command = 3;
  string cwd = 4;
  string session = 5;
  string hostname = 6;
  string author = 7;
  string intent = 8;
  int64 exit = 9;
  int64 duration = 10;
  string shell = 11;
  AuthorKind author_kind = 12;
}

message TailHistoryReply {
  HistoryEventKind kind = 1;
  HistoryEntry history = 2;
  // Number of events dropped, only meaningful when kind == LAGGED.
  uint64 dropped = 3;
}

service History {
  rpc StartHistory(StartHistoryRequest) returns (StartHistoryReply);
  rpc EndHistory(EndHistoryRequest) returns (EndHistoryReply);
  rpc CancelHistory(CancelHistoryRequest) returns (CancelHistoryReply);
  rpc TailHistory(TailHistoryRequest) returns (stream TailHistoryReply);
  rpc Status(StatusRequest) returns (StatusReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);
}
