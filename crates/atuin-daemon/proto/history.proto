syntax = "proto3";
package history;

// Whether a human or an agent ran a command. Unspecified means the caller did
// not say, and the author name is all the receiver has to go on. Unspecified is
// also what keeps this backwards compatible: it is proto3's zero value, so a
// peer from before this field existed reads and writes it implicitly.
enum AuthorKind {
  AUTHOR_KIND_UNSPECIFIED = 0;
  AUTHOR_KIND_USER = 1;
  AUTHOR_KIND_AGENT = 2;
}

// Who ran a command. `name` is the author identity as stated by the
// integration; `kind` says whether that is a human or an agent.
message Author {
  AuthorKind kind = 1;
  string name = 2;
}

message StartHistoryRequest {
  // Briefly held a flat `AuthorKind author_kind` while that feature was in
  // review; it was never in a release, but reserve it anyway.
  reserved 9;

  // If people are still using my software in ~530 years, they can figure out a u128 migration
  uint64 timestamp = 1; // nanosecond unix epoch
  string command = 2;
  string cwd = 3;
  string session = 4;
  string hostname = 5;
  // The author name alone, readable by daemons from before `Author` existed.
  // Writers must keep setting this to `author.name`; readers only look at it
  // when `author` is absent. This is the released `author` field renamed:
  // field names are not part of the wire format, only the number is.
  string legacy_author = 6;
  string intent = 7;
  string shell = 8;
  Author author = 10;
}

message EndHistoryRequest {
  string id = 1;
  int64 exit = 2;
  uint64 duration = 3;
}

// Cancel an in-progress history entry without adding it to the database.
message CancelHistoryRequest {
  string id = 1;
}

message StartHistoryReply {
  string id = 1;
  string version = 2;
  uint32 protocol = 3;
}

message EndHistoryReply {
  string id = 1;
  uint64 idx = 2;
  string version = 3;
  uint32 protocol = 4;
}

message CancelHistoryReply {
  string version = 1;
  uint32 protocol = 2;
}

message StatusRequest {}

message StatusReply {
  bool healthy = 1;
  string version = 2;
  uint32 pid = 3;
  uint32 protocol = 4;
}

message ShutdownRequest {}

message ShutdownReply {
  bool accepted = 1;
}

message TailHistoryRequest {}

enum HistoryEventKind {
  HISTORY_EVENT_KIND_UNSPECIFIED = 0;
  HISTORY_EVENT_KIND_STARTED = 1;
  HISTORY_EVENT_KIND_ENDED = 2;
}

message HistoryEntry {
  // Briefly held a flat `AuthorKind author_kind` while that feature was in
  // review; it was never in a release, but reserve it anyway.
  reserved 12;

  uint64 timestamp = 1; // nanosecond unix epoch
  string id = 2;
  string command = 3;
  string cwd = 4;
  string session = 5;
  string hostname = 6;
  // The author name alone, readable by clients from before `Author` existed.
  // Same contract as `StartHistoryRequest.legacy_author`.
  string legacy_author = 7;
  string intent = 8;
  int64 exit = 9;
  int64 duration = 10;
  string shell = 11;
  Author author = 13;
}

message TailHistoryReply {
  HistoryEventKind kind = 1;
  HistoryEntry history = 2;
}

service History {
  rpc StartHistory(StartHistoryRequest) returns (StartHistoryReply);
  rpc EndHistory(EndHistoryRequest) returns (EndHistoryReply);
  rpc CancelHistory(CancelHistoryRequest) returns (CancelHistoryReply);
  rpc TailHistory(TailHistoryRequest) returns (stream TailHistoryReply);
  rpc Status(StatusRequest) returns (StatusReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);
}
