[package]
name = "atuin-daemon"
edition = "2024"
description = "The daemon crate for Atuin"

authors.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
ai = ["atuin-client/ai", "atuin-common/ai"]
octavo = ["ai", "dep:atuin-octavo", "atuin-client/octavo"]
# Runs the desktop capture helper, stores what it reads, and serves the store over gRPC.
desktop-capture = ["atuin-common/rmp-frame", "dep:atuin-desktop-capture", "dep:blake3", "dep:rand", "dep:rmp-serde", "dep:zstd"]

[dependencies]
async-stream = { workspace = true }
blake3 = { workspace = true, optional = true }
atuin-client = { workspace = true, features = ["proto"] }
atuin-common = { workspace = true, features = ["os", "proto", "sqlite"] }
atuin-desktop-capture = { workspace = true, optional = true, default-features = false, features = ["link"] }
atuin-domain = { workspace = true }
atuin-history = { workspace = true }
atuin-kv = { workspace = true }
atuin-octavo = { workspace = true, optional = true }
atuin-scripts = { workspace = true }
dashmap = { workspace = true }
derive_more = { workspace = true }
easy-cast = { workspace = true }
enum_dispatch = { workspace = true }
jiff = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
eyre = { workspace = true }
fjall = { workspace = true }
fixedbitset = { workspace = true }
frizbee = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true }
itertools = { workspace = true }
lasso = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true, optional = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
daemonix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
listenfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { workspace = true }
# Tells a launchd job's own process from what it runs.
rustix = { workspace = true }
service-manager = { workspace = true }

[dev-dependencies]
atuin-common = { workspace = true, features = ["test-utils"] }
proptest = { workspace = true }
regex = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
workspace = true
