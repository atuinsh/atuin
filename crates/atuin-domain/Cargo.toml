[package]
name = "atuin-domain"
edition = "2024"
description = "Core domain and API types shared across Atuin's client, daemon, and server"

rust-version = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { workspace = true }
atuin-common = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
semver = { workspace = true }
typed-builder = { workspace = true }
derive_more = { workspace = true }
eyre = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
reqwest-middleware = { workspace = true }
http = { workspace = true }
xxhash-rust = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", optional = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tracing = { workspace = true }

# See `http::musl_dns`: musl's resolver races all of resolv.conf's nameservers
# and takes the first reply, which breaks split-horizon DNS. We drive
# hickory-dns ourselves so negative responses don't end a lookup early.
[target.'cfg(target_env = "musl")'.dependencies]
hickory-resolver = "0.26"

[features]
# Feature-gated axum integration for the server-side capability handlers (`caps::axum`).
axum = ["dep:axum"]

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest = { workspace = true }
proptest = { workspace = true }
wiremock = { workspace = true }
tower = { workspace = true, features = ["util"] }
