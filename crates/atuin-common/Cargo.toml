[package]
name = "atuin-common"
edition = "2024"
description = "common library for atuin"

authors.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
ai = ["dep:shlex"]
ansi = ["dep:atuin-vt100", "dep:memchr"]
db = ["dep:sqlx"]
os = ["dep:windows-sys"]
proto = ["dep:prost"]
sqlite = ["db", "sqlx/sqlite", "sqlx/regexp", "dep:libsqlite3-sys", "dep:tokio-util"]
test-utils = ["dep:tracing-subscriber"]
unicode = ["dep:unicode-width", "dep:unicode-segmentation"]

[dependencies]
atuin-vt100 = { workspace = true, optional = true }

async-stream = { workspace = true }
base64 = { workspace = true }
bytesize = { workspace = true }
crypto_secretbox = { workspace = true }
derive_more = { workspace = true }
directories = { workspace = true }
easy-cast = { workspace = true }
enum_dispatch = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
humantime = { workspace = true }
itertools = { workspace = true }
libsqlite3-sys = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
prost = { workspace = true, optional = true }
regex = { workspace = true }
rmp = { workspace = true }
schemars = { workspace = true }
rusty_paserk = { workspace = true }
rusty_paseto = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
shlex = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tiny-bip39 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
# os::fd, which fs::pool needs in every build.
rustix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# os::fd, which fs::pool needs in every build. proc_pidinfo and sysctlbyname, which rustix does
# not wrap.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
divan = { workspace = true }
fs-err = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "onlcr"
harness = false
required-features = ["ansi"]

[lints]
workspace = true
