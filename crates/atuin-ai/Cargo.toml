[package]
name = "atuin-ai"
edition = "2024"
description = "AI integration for Atuin CLI"

authors.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
clipboard = ["dep:arboard"]

[dependencies]
atuin-client = { workspace = true, features = ["ai"] }
atuin-common = { workspace = true, features = ["ai", "sqlite", "unicode"] }
atuin-daemon = { workspace = true, features = ["ai"] }
atuin-domain = { workspace = true }

async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
crossterm = { workspace = true, features = ["use-dev-tty", "event-stream"] }
derive_more = { workspace = true }
eyre = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
i18n-embed = { workspace = true }
jiff = { workspace = true }
parking_lot = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
regex = { workspace = true }
rmcp = { workspace = true }
rust-embed = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }

strum = { workspace = true }
strum_macros = { workspace = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, optional = true, features = ["wayland-data-control"] }

[dev-dependencies]
atuin-common = { workspace = true, features = ["test-utils"] }
proptest = { workspace = true }
rstest = { workspace = true }

[lints]
workspace = true
