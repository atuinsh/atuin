[package]
name = "atuin-pty-proxy"
edition = "2024"
description = "a PTY proxy for atuin"

version = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
clap = { workspace = true }

[target.'cfg(unix)'.dependencies]
atuin-common = { workspace = true, features = ["ansi"] }
crossterm = { workspace = true }
eyre = { workspace = true }
nix = { version = "0.29", features = ["socket", "user"] }
portable-pty = "0.9"
libc = "0.2"
rand = { workspace = true }
rustix = { workspace = true, features = ["termios"] }
signal-hook = "0.3"
unicode-width = "0.2"
vt100 = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# `resource` is for the fd-pressure integration test's setrlimit only.
nix = { version = "0.29", features = ["socket", "user", "resource", "term"] }
tempfile = { workspace = true }
