syntax = "proto3";

package atuin.api.v1;

import "atuin/api/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// A finished shell command.
message History {
  // Client-generated, unique per user. Required.
  UuidV7 id = 1;
  // The identifier of the record if available.
  UuidV7 record_id = 2;
  // The command string that was ran. Required.
  string command = 3;
  // The working directory the command ran in. Required.
  string cwd = 4;
  // The exit code of the shell command.
  int32 exit = 5;
  // When the command started. Required.
  google.protobuf.Timestamp start_time = 6;
  // How long the command ran. Required, and never negative.
  google.protobuf.Duration duration = 7;
  // The terminal session the command ran in. Client-generated, unique per
  // user. Required.
  UuidV7 session = 8;
  // The machine and account the command ran on. Required.
  CmdOrigin cmd_origin = 9;
  // Who decided to run the command. Required.
  Author author = 10;
  // Why the command was run, if whatever ran it said so.
  optional string intent = 11;
  // The shell that ran the command, e.g. `zsh`, if known.
  optional string shell = 12;
}
