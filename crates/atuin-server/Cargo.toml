[package]
name = "atuin-server"
edition = "2024"
description = "server library for atuin"

rust-version = { workspace = true }
version = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[lib]
name = "atuin_server"
path = "src/lib.rs"

[[bin]]
name = "atuin-server"
path = "src/bin/main.rs"

[features]
# Statically link (vendor) OpenSSL for native-tls instead of using the system
# libssl. Used for portable release artifacts; a no-op on macOS/Windows.
vendored-tls = ["reqwest/native-tls-vendored"]

[dependencies]
atuin-common = { workspace = true, features = ["db"] }
atuin-domain = { workspace = true, features = ["axum"] }

tracing = { workspace = true }
eyre = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
fs-err = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { workspace = true }
url = { workspace = true }
argon2 = "0.5"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics = "0.24"
clap = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
derive_more = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "sqlite", "mysql", "regexp", "tls-native-tls"] }
# sea-orm rides on the SAME sqlx 0.9 the workspace already pins (it requires
# sqlx ^0.9), so cargo unifies to one sqlx + one bundled sqlite. default-features
# is off deliberately: the defaults pull chrono + rust_decimal, and this
# workspace uses `time`. runtime-tokio-native-tls matches the sqlx tls above.
sea-orm = { version = "2.0.2", default-features = false, features = [
  "macros",
  "sqlx-postgres",
  "sqlx-mysql",
  "sqlx-sqlite",
  "runtime-tokio-native-tls",
  "with-uuid",
  "with-time",
] }

# Integration tests in tests/ spin up a real server and drive it with the
# client's api_client. atuin-client is only a dev dependency here so the client
# binary crate stays free of server/postgres deps (see issue #2884).
[dev-dependencies]
atuin-client = { path = "../atuin-client", version = "18.20.1", default-features = false, features = ["sync"] }
rstest = { workspace = true }
futures-util = "0.3"
tracing-tree = "0.4"
tower = { workspace = true, features = ["util"] }
regex = { workspace = true }

[lints]
workspace = true
