syntax = "proto3";

package atuin.api.v1;

import "buf/validate/validate.proto";

// Represents a UUIDv7 value.
message UuidV7 {
  bytes value = 1 [(buf.validate.field).bytes.len = 16];
}

// The atuin install that captured a record. Any UUID version: installs from before UUIDv7 ids
// keep the id they had.
message HostId {
  bytes value = 1 [(buf.validate.field).bytes.len = 16];
}
