syntax = "proto3";

package atuin.api.v1;

import "atuin/api/v1/common.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// A finished shell command.
message History {
  // Client-generated, unique per user.
  UuidV7 id = 1 [(buf.validate.field).required = true];
  // The identifier of the record if available.
  UuidV7 record_id = 2;
  // The command string that was ran.
  string command = 3 [(buf.validate.field).required = true];
  // The working directory the command ran in.
  string cwd = 4 [(buf.validate.field).required = true];
  // The exit code of the shell command.
  int32 exit = 5;
  // When the command started.
  google.protobuf.Timestamp start_time = 6 [(buf.validate.field).required = true];
  // How long the command ran and never negative.
  google.protobuf.Duration duration = 7 [(buf.validate.field).duration.gte = {}];
  // The terminal session the command ran in, as the client names it. Unique per user, and empty
  // when the client doesn't know it.
  string session = 8 [(buf.validate.field).string.max_bytes = 128];
  // The machine and account the command ran on.
  CmdOrigin cmd_origin = 9 [(buf.validate.field).required = true];
  // Who decided to run the command.
  Author author = 10 [(buf.validate.field).required = true];
  // Why the command was run, if whatever ran it said so.
  optional string intent = 11;
  // The shell that ran the command, e.g. `zsh`, if known.
  optional string shell = 12;
}

// What a finished command printed, as its terminal showed it once it finished.
message HistoryOutput {
  // All of the rendered output, or its start when `end` is set. Carries SGR escapes and no other
  // control characters but `\n`. `start` and `end` together hold at most 1 MiB.
  string start = 1;
  // The end of output too long to keep whole; what came between `start` and `end` was dropped.
  optional string end = 2;
  // The bytes the terminal received from the command, before rendering.
  uint64 observed_bytes = 3;
  // The terminal's size when the command finished.
  uint32 terminal_width = 4 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 65535
  }];
  uint32 terminal_height = 5 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 65535
  }];
}
