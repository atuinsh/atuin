message RotateShareLinkRequest {
  // The share, as `Share.id` gives it.
  UuidV7 id = 1 [(buf.validate.field).required = true];
}

message RotateShareLinkResponse {
  // The share, with its new link token. Logically required.
  Share share = 1 [(buf.validate.field).required = true];
}

message SetShareAudienceRequest {
  // The share, as `Share.id` gives it.
  UuidV7 id = 1 [(buf.validate.field).required = true];
  // Logically required.
  ShareAudience audience = 2 [(buf.validate.field).required = true];
}

message SetShareAudienceResponse {
  // The share, with its new audience. Logically required.
  Share share = 1 [(buf.validate.field).required = true];
}

message DeleteShareRequest {
  // The share, as `Share.id` gives it.
  UuidV7 id = 1 [(buf.validate.field).required = true];
}

message DeleteShareResponse {}

message ListOrgThreadsRequest {
  // The organization's slug, matched without regard to case.
  string org_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    not_contains: "\x00"
  }];
  // The most threads to return in one page. At most 200; larger values are rejected. 0 means 50.
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 200];
  // Opaque. Copy the `next_page_token` of the previous page, or leave empty for the first page.
  string page_token = 3;
}

message ListOrgThreadsResponse {
  // The threads on this page.
  repeated OrgThread threads = 1;
  // Opaque. Empty on the last page.
  string next_page_token = 2;
}

message WatchOrgThreadsRequest {
  // The organization's slug, matched without regard to case.
  string org_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    not_contains: "\x00"
  }];
  // The most threads to send before `caught_up`. At most 200. Larger values are rejected. 0 means
  // 50.
  uint32 page_size = 2 [(buf.validate.field).uint32.lte = 200];
}

// One message on a `WatchOrgThreads` stream.
message WatchOrgThreadsResponse {
  oneof event {
    option (buf.validate.oneof).required = true;

    // A thread shared with the organization, as it stands.
    OrgThread thread = 1;
    // A thread to leave out from now on.
    WatchThreadsRemoved removed = 2;
    // The first page has been sent.
    WatchThreadsCaughtUp caught_up = 3;
    // Shows that the stream is still open.
    WatchThreadsHeartbeat heartbeat = 4;
  }
}

message SearchOrgThreadsRequest {
  // The organization's slug, matched without regard to case.
  string org_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    not_contains: "\x00"
  }];
  // Which threads to return.
  ThreadQuery query = 2;
  // How to sort them. Logically required.
  ThreadOrder order = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // The most threads to return in one page. At most 50. Larger values are rejected. 0 means 20.
  uint32 page_size = 4 [(buf.validate.field).uint32.lte = 50];
  // Opaque. Copy the `next_page_token` of the previous page. Leave it empty for the first page.
  string page_token = 5;
}

message SearchOrgThreadsResponse {
  // The threads on this page, in `order`.
  repeated ThreadHit hits = 1;
  // Opaque. Empty on the last page.
  string next_page_token = 2;
}

message TallyOrgThreadsRequest {
  // The organization's slug, matched without regard to case.
  string org_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    not_contains: "\x00"
  }];
  // Which threads to count.
  ThreadQuery query = 2;
}

message TallyOrgThreadsResponse {
  // The count, and the most common values among them.
  TallyThreadsResponse tally = 1;
}

// A thread a member has shared with an organization.
message OrgThread {
  // What opens it to the organization's members. Logically required.
  Share share = 1 [(buf.validate.field).required = true];
  // The shared thread itself, as its share reads it. Logically required.
  Thread thread = 2 [(buf.validate.field).required = true];
}

message TallyOrgActivityRequest {
  // The organization's slug, matched without regard to case.
  string org_slug = 1 [(buf.validate.field).string = {
    min_len: 1
    not_contains: "\x00"
  }];
  // How many days to count, ending with today.
  uint32 days = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 90
  }];
  // The IANA time zone whose calendar days the counts fall into, such as `Europe/Berlin`. Today is
  // the day it is there now.
  string time_zone = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 64
    not_contains: "\x00"
  }];
}

message TallyOrgActivityResponse {
  // What the members did together, counted as `TallyThreadActivity` counts a user's: a streak's
  // day is one with a prompt from any member, and the peak counts all of their threads at once.
  TallyThreadActivityResponse activity = 1;
  // How many members had a message on each of `activity.days`, in the same order.
  repeated uint32 daily_active_members = 2;
  // How many members had a message over the counted days.
  uint32 active_members = 3;
  // Every member of the organization, most messages first, ties broken by username.
  repeated OrgMemberActivity members = 4;
}

// One member's activity over the counted days.
message OrgMemberActivity {
  string username = 1;
  // The counted days together.
  ThreadActivityCounts counts = 2;
  // Their messages on each of `TallyOrgActivityResponse.activity.days`, in the same order.
  repeated uint64 daily_messages = 3;
  // When their newest message was written, on any day; unset when they have none.
  google.protobuf.Timestamp last_active_at = 4;
}
