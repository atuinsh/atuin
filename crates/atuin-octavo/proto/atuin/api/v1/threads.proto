syntax = "proto3";

package atuin.api.v1;

import "atuin/api/v1/common.proto";
import "atuin/api/v1/share.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// A session as its harness names it: the identity of a thread.
message HarnessSession {
  reserved 1;

  // The agent harness the session ran in, by the name atuin gives it, e.g. `claude-code`, `codex`
  // or `pi`. The hub stores any name of this form, so a harness atuin adds needs no hub change.
  string harness = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 32
    pattern: "^[a-z0-9][a-z0-9-]*$"
  }];
  // The harness's id for the session, e.g. a Claude Code session UUID or an opencode `ses_...`.
  string session_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
    not_contains: "\x00"
  }];
}

// How a thread relates to the thread its harness named as its parent. The hub stores a kind it
// doesn't know as unspecified.
enum ThreadParentKind {
  THREAD_PARENT_KIND_UNSPECIFIED = 0;
  // Spawned by its parent to do part of its work.
  THREAD_PARENT_KIND_SUBAGENT = 1;
  // A copy of the parent's conversation that went its own way.
  THREAD_PARENT_KIND_FORK = 2;
  // The parent's conversation carried on under a new session.
  THREAD_PARENT_KIND_CONTINUATION = 3;
}

// The tokens of one model call, as the harness reported them. A count it did not report is unset,
// never 0.
message TokenUsage {
  // Input neither read from the prompt cache nor written to it.
  optional uint64 input = 1 [(buf.validate.field).uint64.lte = 9223372036854775807];
  optional uint64 output = 2 [(buf.validate.field).uint64.lte = 9223372036854775807];
  // Input read from the prompt cache.
  optional uint64 cache_read = 3 [(buf.validate.field).uint64.lte = 9223372036854775807];
  // Input written to the prompt cache.
  optional uint64 cache_write = 4 [(buf.validate.field).uint64.lte = 9223372036854775807];
  // Of `output`, the tokens spent reasoning.
  optional uint64 reasoning = 5 [(buf.validate.field).uint64.lte = 9223372036854775807];
}

// One ordered piece of a message's content.
message ContentBlock {
  oneof block {
    option (buf.validate.oneof).required = true;

    // Text the person or the model wrote.
    string text = 1 [(buf.validate.field).string.not_contains = "\x00"];
    // The model asked to run a tool.
    ToolCall tool_call = 2;
    // A tool answered.
    ToolResult tool_result = 3;
    // The model reasoned, and the harness kept only that it did.
    ReasoningSummary reasoning_summary = 5;
    // A model-written summary standing in for earlier conversation: a compaction or an abandoned
    // branch.
    string summary = 7 [(buf.validate.field).string.not_contains = "\x00"];
    // Why a model call failed or was aborted, as the harness reported it.
    string failure = 8 [(buf.validate.field).string.not_contains = "\x00"];
    // The changes a tool call made to files.
    Patch patch = 9;
  }

  // Numbered as atuin's daemon numbers its blocks; Octavo stores neither reasoning text nor
  // blocks atuin doesn't model.
  reserved 4, 6;
  reserved "thinking", "other";

  // The model's request to run a tool.
  message ToolCall {
    // The call's id, which its result names.
    string id = 1 [(buf.validate.field).string = {
      max_bytes: 512
      not_contains: "\x00"
    }];
    // e.g. `Bash`.
    string name = 2 [(buf.validate.field).string = {
      max_bytes: 256
      not_contains: "\x00"
    }];
    // The arguments, as JSON; unset when the capture kept none.
    optional string input = 3 [(buf.validate.field).string.not_contains = "\x00"];
  }

  // What a tool handed back.
  message ToolResult {
    // The `ToolCall.id` this answers.
    string call_id = 1 [(buf.validate.field).string = {
      max_bytes: 512
      not_contains: "\x00"
    }];
    // The output, as JSON; unset when the capture kept none.
    optional string output = 2 [(buf.validate.field).string.not_contains = "\x00"];
    // Whether the tool reported a failure.
    bool is_error = 3;
  }

  message ReasoningSummary {
    // The tokens the call spent reasoning, for display only: `ThreadMessage.usage` counts them.
    optional uint64 tokens = 1;
  }

  // What a tool call changed, file by file in the order its harness listed them.
  message Patch {
    // The `ToolCall.id` of the call that made the changes.
    string call_id = 1 [(buf.validate.field).string = {
      max_bytes: 512
      not_contains: "\x00"
    }];
    repeated FilePatch files = 2;
  }

  message FilePatch {
    // The file, as the harness named it: absolute, or relative to the session's directory.
    string path = 1 [(buf.validate.field).string.not_contains = "\x00"];
    // Logically required; the hub rejects `CHANGE_UNSPECIFIED`.
    Change change = 2 [
      (buf.validate.field).required = true,
      (buf.validate.field).enum.defined_only = true
    ];
    // Where an update moved the file to, if it did.
    optional string moved_to = 3 [(buf.validate.field).string.not_contains = "\x00"];
    repeated Hunk hunks = 4;

    enum Change {
      CHANGE_UNSPECIFIED = 0;
      CHANGE_ADD = 1;
      CHANGE_UPDATE = 2;
      CHANGE_DELETE = 3;
    }
  }

  // A unified diff hunk, `@@ -old_start,old_lines +new_start,new_lines @@`, and its lines, each
  // starting with ` `, `-`, `+` or `\`.
  message Hunk {
    uint64 old_start = 1;
    uint64 old_lines = 2;
    uint64 new_start = 3;
    uint64 new_lines = 4;
    repeated string lines = 5 [(buf.validate.field).repeated.items.string.not_contains = "\x00"];
  }
}

// One line of a thread, as the atuin install that captured it recorded it.
message ThreadMessage {
  option (buf.validate.message).cel = {
    id: "thread_message.role_label"
    message: "role_label is set exactly when role is ROLE_OTHER"
    expression: "has(this.role_label) == (this.role == 5)"
  };
  option (buf.validate.message).cel = {
    id: "thread_message.stop_reason_label"
    message: "stop_reason_label is set exactly when stop_reason is STOP_REASON_OTHER"
    expression: "has(this.stop_reason_label) == (this.stop_reason == 8)"
  };

  // The id of the record the client stored the line in. Unique per user.
  UuidV7 id = 1 [(buf.validate.field).required = true];
  // The harness's id for the line, unique within its thread: a thread keeps one line per
  // `source_id`, the first stored.
  string source_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 512
    not_contains: "\x00"
  }];
  // The `source_id` of the line this one follows, if any.
  optional string parent_source_id = 3 [(buf.validate.field).string = {
    max_bytes: 512
    not_contains: "\x00"
  }];
  // When the line was written.
  google.protobuf.Timestamp timestamp = 4 [(buf.validate.field).required = true];
  // Logically required; the hub rejects `ROLE_UNSPECIFIED`.
  Role role = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];
  // The harness's own role, e.g. Codex's `developer`. Set exactly when `role` is `ROLE_OTHER`.
  optional string role_label = 6 [(buf.validate.field).string = {
    max_bytes: 128
    not_contains: "\x00"
  }];
  // In order. Empty for a line kept only for its usage, title or place in the thread. Its strings
  // hold at most 1 MiB together.
  repeated ContentBlock content = 7;
  // The working directory at this line.
  optional string cwd = 8 [(buf.validate.field).string = {
    max_bytes: 4096
    not_contains: "\x00"
  }];
  // The git branch checked out at this line.
  optional string git_branch = 9 [(buf.validate.field).string = {
    max_bytes: 256
    not_contains: "\x00"
  }];
  // The model that wrote the line.
  optional string model = 10 [(buf.validate.field).string = {
    max_bytes: 256
    not_contains: "\x00"
  }];
  // Who served `model`, e.g. `openai-codex`.
  optional string provider = 11 [(buf.validate.field).string = {
    max_bytes: 256
    not_contains: "\x00"
  }];
  // The tokens of the model call the line came from, as this line reported them: lines of one
  // call repeat or grow the same counts (see `turn_id`).
  TokenUsage usage = 12;
  // Why the model call ended; `STOP_REASON_UNSPECIFIED` when the harness did not say.
  StopReason stop_reason = 13 [(buf.validate.field).enum.defined_only = true];
  // The harness's own stop reason. Set exactly when `stop_reason` is `STOP_REASON_OTHER`.
  optional string stop_reason_label = 14 [(buf.validate.field).string = {
    max_bytes: 128
    not_contains: "\x00"
  }];
  // The model call the line came from, the same on every line of that call.
  optional string turn_id = 15 [(buf.validate.field).string = {
    max_bytes: 512
    not_contains: "\x00"
  }];
  // The atuin install that captured the line.
  HostId host = 16 [(buf.validate.field).required = true];

  // Who wrote a line, as its harness said. Tool output a harness sends back as a user turn stays
  // `ROLE_USER`.
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_ASSISTANT = 2;
    ROLE_SYSTEM = 3;
    // A turn carrying tool output, for harnesses that make it its own turn.
    ROLE_TOOL = 4;
    // A role none of the above names; `role_label` carries it.
    ROLE_OTHER = 5;
  }

  // Why a model call ended. 1-7 are numbered as atuin's daemon numbers them.
  enum StopReason {
    STOP_REASON_UNSPECIFIED = 0;
    STOP_REASON_END_TURN = 1;
    STOP_REASON_TOOL_USE = 2;
    STOP_REASON_MAX_TOKENS = 3;
    STOP_REASON_ABORTED = 4;
    STOP_REASON_ERROR = 5;
    STOP_REASON_STOP_SEQUENCE = 6;
    STOP_REASON_REFUSAL = 7;
    // A reason none of the above names; `stop_reason_label` carries it.
    STOP_REASON_OTHER = 8;
  }
}

// A line as the install that captured it uploads it, with what that install knew of its thread.
message CapturedThreadMessage {
  option (buf.validate.message).cel = {
    id: "captured_thread_message.parent"
    message: "parent is not the thread itself"
    expression:
      "!has(this.parent) || this.parent.harness != this.thread.harness"
      " || this.parent.session_id != this.thread.session_id"
  };
  option (buf.validate.message).cel = {
    id: "captured_thread_message.parent_kind"
    message: "a known parent_kind needs a parent"
    expression: "has(this.parent) || !(this.parent_kind in [1, 2, 3])"
  };

  // Logically required.
  HarnessSession thread = 1 [(buf.validate.field).required = true];
  // The id this install minted for the thread, beside the harness's own `thread.session_id`.
  // Installs may mint different ones for one thread; the hub keeps the least.
  UuidV7 client_session_id = 2 [(buf.validate.field).required = true];
  // The thread `thread` came from, if its harness named one. May be of another harness; `thread`
  // itself is rejected.
  HarnessSession parent = 3;
  // How `thread` relates to `parent`; `THREAD_PARENT_KIND_UNSPECIFIED` when the harness did not
  // say. The hub stores a kind it doesn't know as unspecified, and rejects any other while `parent`
  // is unset.
  ThreadParentKind parent_kind = 4;
  // The thread's title when the line was captured. The newest line's title, or its absence, is
  // the thread's.
  optional string thread_title = 5 [(buf.validate.field).string = {
    max_bytes: 1024
    not_contains: "\x00"
  }];
  // Logically required.
  ThreadMessage message = 6 [(buf.validate.field).required = true];
}

// A thread as `ListThreads` lists it: what identifies it, and what its messages say of it.
message Thread {
  // The thread's id, which `GetThread`, `ListThreadMessages` and `WatchThread` take. Stable for the
  // life of the thread.
  UuidV7 id = 19;
  // The harness session the thread is.
  HarnessSession session = 1;
  // The least `CapturedThreadMessage.client_session_id` any install sent for the thread.
  UuidV7 client_session_id = 2;
  // The thread `session` came from, if its harness named one. May be of another harness.
  HarnessSession parent = 3;
  // How `session` relates to `parent`; `THREAD_PARENT_KIND_UNSPECIFIED` when no message said.
  ThreadParentKind parent_kind = 4;
  // The parent's `client_session_id`; unset while the parent is not stored.
  UuidV7 parent_client_session_id = 5;
  // The parent's `id`; unset while the parent is not stored.
  UuidV7 parent_id = 20;
  // The newest message's `thread_title`, if it had one.
  optional string title = 6;
  // When the earliest message was written.
  google.protobuf.Timestamp started_at = 7;
  // When the newest message was written.
  google.protobuf.Timestamp last_message_at = 8;
  // The install that captured the earliest message.
  HostId host = 9;
  // How many messages have text: prompts and replies, not tool calls or their results.
  uint64 message_count = 10;
  // How many messages call a tool.
  uint64 tool_call_count = 21;
  // The tokens of the thread's model calls, each call counted once.
  TokenUsage usage = 11;
  // The opening prompt: the first text of the earliest user message that has any among the
  // thread's first 64 messages, clipped to 600 characters, then `…` when there was more.
  optional string preview = 12;
  // The newest assistant message with a non-blank text: its non-blank texts, trimmed, joined by
  // lines and clipped to 600 characters, then `…` when there was more.
  optional string last_reply = 13;
  // Where the thread started: the first working directory, git branch and model its first 64
  // messages name, and who served that model.
  optional string cwd = 14;
  optional string git_branch = 15;
  optional string model = 16;
  optional string provider = 17;
  // How many stored threads name this one as their parent.
  uint64 child_count = 18;
  // The ids of the `Label`s its owner gave it. Empty through a share.
  repeated UuidV7 label_ids = 22;
}

// A label its owner gives threads to sort them by, as GitHub labels issues.
message Label {
  // A UUIDv7 the owner's client mints. Logically required.
  UuidV7 id = 1 [(buf.validate.field).required = true];
  // Unique among its owner's labels, ignoring case: up to 50 characters, without control characters
  // or quotes, nor a space at either end.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
    pattern: "^[^ \"\\x00-\\x1f\\x7f-\\x9f]([^\"\\x00-\\x1f\\x7f-\\x9f]*[^ \"\\x00-\\x1f\\x7f-\\x9f])?$"
  }];
  // Its color, as six lowercase hex digits, such as `d73a4a`.
  string color = 3 [(buf.validate.field).string.pattern = "^[0-9a-f]{6}$"];
  // What it's for, up to 100 characters without control characters; empty for nothing.
  string description = 4 [(buf.validate.field).string = {
    max_len: 100
    pattern: "^[^\\x00-\\x1f\\x7f-\\x9f]*$"
  }];
}

// Which of the calling user's threads to list.
//
// Unset fields match any thread, except that subagents are left out unless asked for.
message ThreadFilter {
  // Whether to list threads spawned as subagents (`THREAD_PARENT_KIND_SUBAGENT`), which most
  // threads are.
  bool include_subagents = 1;
  // Only the threads naming this thread as their parent. Set `include_subagents` too for its
  // subagents.
  HarnessSession parent = 2;
  // Only threads of this harness, e.g. `claude-code`.
  optional string harness = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 32
    pattern: "^[a-z0-9][a-z0-9-]*$"
  }];
  oneof cwd {
    // Only threads whose starting working directory contains this text.
    string cwd_contains = 4 [(buf.validate.field).string = {
      min_len: 1
      max_bytes: 4096
      not_contains: "\x00"
    }];
    // Only threads that started in exactly this working directory.
    string cwd_equals = 7 [(buf.validate.field).string = {
      min_len: 1
      max_bytes: 4096
      not_contains: "\x00"
    }];
  }
  // Only threads that started on this git branch.
  optional string git_branch = 5 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
    not_contains: "\x00"
  }];
  oneof model {
    // Only threads whose starting model contains this text, e.g. `opus`.
    string model_contains = 6 [(buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
      not_contains: "\x00"
    }];
    // Only threads that started on exactly this model: `gpt-5` and not `gpt-5-codex`.
    string model_equals = 8 [(buf.validate.field).string = {
      min_len: 1
      max_bytes: 256
      not_contains: "\x00"
    }];
  }
  // Only threads with a label of each of these names, ignoring case. Through a share, labels match
  // no thread.
  repeated string labels = 9 [(buf.validate.field).repeated = {
    max_items: 20
    items: {
      string: {
        min_len: 1
        max_len: 50
        pattern: "^[^ \"\\x00-\\x1f\\x7f-\\x9f]([^\"\\x00-\\x1f\\x7f-\\x9f]*[^ \"\\x00-\\x1f\\x7f-\\x9f])?$"
      }
    }
  }];
}

// What `SearchThreads`, `TallyThreads` and `ListThreadMatches` look for: the threads `filter`
// allows, narrowed by text, role and time.
//
// Unset fields match anything. A query with no `terms` lists by the other fields alone.
message ThreadQuery {
  // Which threads to search.
  ThreadFilter filter = 1;
  // Every term must appear in one message of a thread, or all in its title, ignoring case and
  // accents. A term of several words matches them together and in order.
  repeated string terms = 2 [(buf.validate.field).repeated = {
    max_items: 16
    items: {
      string: {
        min_len: 1
        max_bytes: 256
        not_contains: "\x00"
      }
    }
  }];
  // Whether the last term's last word also matches as a prefix, once it has two characters.
  bool prefix_last_term = 3;
  // Only messages of these roles match, and the title doesn't; any role when empty.
  repeated ThreadMessage.Role roles = 4 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
  // Only threads last active at or after this time.
  google.protobuf.Timestamp active_after = 5;
  // Only threads last active before this time.
  google.protobuf.Timestamp active_before = 6;
}

// How `SearchThreads` sorts the threads it returns.
enum ThreadOrder {
  THREAD_ORDER_UNSPECIFIED = 0;
  // The best match first. A title match outweighs a body match, a short message that mentions the
  // words outranks a long one that mentions them once, and a more recently active thread ranks
  // higher. Ties go to the more recently active thread, then to the higher id.
  THREAD_ORDER_RELEVANCE = 1;
  // The most recently active thread first, as `ListThreads` orders them.
  THREAD_ORDER_RECENT = 2;
}

// Text cut from a message or a title around a match, in pieces so a client never has to agree with
// the hub on UTF-8 or UTF-16 offsets.
message Snippet {
  // The text in order; joined, they are the snippet.
  repeated Segment segments = 1;
  // Whether the snippet starts mid-text, so a client can show an ellipsis before it.
  bool clipped_start = 2;
  // Whether the snippet ends mid-text, so a client can show an ellipsis after it.
  bool clipped_end = 3;

  // A run of the snippet's text that matched or didn't.
  message Segment {
    string text = 1;
    // Whether the query matched this text, for a client to highlight.
    bool matched = 2;
  }
}

// A thread `SearchThreads` found, and where in it the query matched best.
message ThreadHit {
  // The matching thread. Without the filter's `include_subagents`, a subagent's match is credited
  // to its nearest stored ancestor that isn't a subagent, or the topmost stored one when there is
  // none.
  Thread thread = 1;
  // The subagent credited to `thread` that holds the best match, set when it is not in `thread`
  // itself.
  Thread subagent = 2;
  // The best matching message's `ThreadMessage.id`; unset for a hit on the title alone.
  UuidV7 message_id = 3;
  // The best matching message's role; `ROLE_UNSPECIFIED` for a hit on the title alone.
  ThreadMessage.Role message_role = 4;
  // The best matching message's text around the match; unset for a hit on the title alone.
  Snippet snippet = 5;
  // The thread's title with the match marked; set when the title matched.
  Snippet title = 6;
  // How many messages of the thread holding the best message match, so a client can show `of <n>`
  // beside the message it opens. 0 for a hit on the title alone.
  uint64 message_matches = 7;
  // The share that opens the hit to the caller. It targets `thread`, or the thread that `thread` was
  // spawned from. It is set only on a search of what's shared with an organization.
  Share share = 8;
}

// One value and how many matching threads have it.
message ThreadTally {
  // The value, such as a harness name or a directory.
  string value = 1;
  // How many matching threads have this value.
  uint64 count = 2;
}
