[graph]
targets = []
all-features = true
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pulled in through
    #   arboard ->
    #     wl-clipboard-rs ->
    #       wayland-client ->
    #         wayland-scanner ->
    #           quick-xml 0.39.4 <-- problematic
    #
    # No upstream patch. Runs only on client, no severe concern.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # The bundled SQLite (libsqlite3-sys < 0.39) can return stale memory when it opens a crafted
    # database and `-wal` pair. The fix needs libsqlite3-sys 0.39, which sqlx 0.9.0 forbids
    # (`<0.38`); sqlx main allows it (launchbadge/sqlx#4502) but has not released it. Atuin
    # opens only files the same user's processes wrote. Remove this, and bump sqlx, rusqlite
    # (0.41) and our own libsqlite3-sys range, once sqlx 0.9.1 ships.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSL-1.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # CC0-1.0 waives copyright but not patents; allow it only for notify.
    { crate = "notify", allow = ["CC0-1.0"] },
    # 0BSD is a permissive, public-domain-equivalent license; it reaches us only
    # through varint-rs (a transitive dependency of fjall's lsm-tree).
    { crate = "varint-rs", allow = ["0BSD"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Unmaintained with an unfixed UB bug (RUSTSEC-2025-0069). Replaced by daemonix.
    { crate = "daemonize", use-instead = "daemonix" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
