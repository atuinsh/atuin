name: e2e

# End-to-end tests are heavier than the Rust suite (they build images and run
# containers), so they run on their own workflow rather than blocking the fast CI.
on:
  pull_request:
    paths:
      - "crates/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [zsh, bash]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run E2E (${{ matrix.shell }})
        working-directory: e2e
        run: |
          uv sync
          uv run pytest -v -m "not tui" \
            --html=report-${{ matrix.shell }}.html --self-contained-html \
            tests/test_capture.py::test_command_is_captured[${{ matrix.shell }}]
      - name: Sync round-trip
        if: matrix.shell == 'zsh'
        working-directory: e2e
        run: |
          uv run pytest -v --html=report-sync.html --self-contained-html \
            tests/test_sync.py

      # On failure the report embeds the rendered screen + container logs for each
      # failed test -- the whole point of the failure-context hook.
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.shell }}
          path: e2e/report-*.html
          if-no-files-found: ignore
