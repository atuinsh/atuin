# Vale (https://vale.sh) configuration for the Atuin docs.
#
# Package URLs are pinned to exact releases so an upstream style change cannot
# turn CI red without a commit here.
StylesPath = .vale/styles

MinAlertLevel = suggestion

Vocab = Atuin

Packages = https://github.com/errata-ai/Microsoft/releases/download/v0.14.2/Microsoft.zip, https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, https://github.com/errata-ai/alex/releases/download/v0.2.3/alex.zip, https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

# The STE style is local, not a package: it is our own encoding of the subset
# of ASD-STE100 Simplified Technical English (issue 9) that a linter can check.
# Each rule file names the STE rule it implements. We deliberately do not adopt
# STE wholesale -- see the notes on Microsoft.Passive and Microsoft.Contractions
# below, and the "Simplified English" section of CONTRIBUTING.md.
[*.md]
BasedOnStyles = Vale, Microsoft, proselint, alex, write-good, STE

# Paths written in prose are literal strings, not words: ~/.config/atuin has to
# stay lowercase, so Vale.Terms and the spelling rules must not see it.
#
# The leading [~.] is required, not optional. With it optional the pattern also
# matched bare "/word" -- including inside fenced code blocks, where a match
# desynchronizes Vale's block parser and silently drops every alert in the rest
# of the file. That blinded 10 of 51 pages, some from as early as line 32.
# Absolute paths in prose belong in backticks, which Vale already skips.
TokenIgnores = (\s[~.]+/[\w./-]*[\w/-])

# Bans every form of "to be" - unusable for technical writing.
write-good.E-Prime = NO
# Duplicate of Microsoft.Passive; keeping both doubles every hit.
write-good.Passive = NO
# Fires on "color", "hook", "execute", "failed". No true positives here.
alex.ProfanityUnlikely = NO
# Would require expanding CLI, TUI, SQL and API on first use on every page.
Microsoft.Acronyms = NO
# Microsoft's A-Z list prefers "back end"; "backend" is right for our audience.
Microsoft.Avoid = NO
# Directly contradicts ASD-STE100 rule 4.2: it rewrites "cannot" to "can't" at
# error level, so with it on, CI pushed the docs away from the form that is
# easier to read in a second language. STE.Contractions is the inverse rule.
Microsoft.Contractions = NO

# Real signal, too much of it to gate on. Reported, never blocking.
# ASD-STE100 rule 3.6 bans the passive outright, but it permits the passive in
# descriptive writing when the agent is unknown, which most of these hits are
# ("history is stored in ~/.local/share/atuin"). Naming an agent there would
# invent one. Left visible so the genuinely reversible ones get fixed by hand.
Microsoft.Passive = suggestion
# Superseded by STE.SentenceLength, which gates at STE's 25-word limit (rule
# 6.3) instead of Microsoft's 30.
Microsoft.SentenceLength = suggestion

# 23 of 30 hits are the Atuin team addressing the reader; removing "we"
# there forces passive voice or a nominalization.
Microsoft.We = NO
# Same reasoning as Microsoft.Acronyms: would expand AI, TUI, MCP, TLS and
# IDE in the headings readers scan and string-match against `atuin mcp`.
Microsoft.HeadingAcronyms = NO
# 14 of 15 hits are FAQ headings in the reader's own voice.
Microsoft.FirstPerson = NO
# Flags any -ly word, and its autofix inverts meaning: dropping
# "accidentally" from "prevents accidentally changing" reverses it.
Microsoft.Adverbs = NO
# All 8 hits are question headings; the "?" is a parsing cue.
Microsoft.HeadingPunctuation = NO
# 45 of 94 hits are literal identifiers -- `## fish`, `### dir`, `### level`
# -- where sentence-casing would contradict the CLI.
Microsoft.Headings = NO
# 20 of its 21 hits duplicate write-good.TooWordy at a lower severity.
Microsoft.Wordiness = NO
# Flags high-frequency hedges ("usually", "several") that carry real meaning.
write-good.Weasel = NO
# Wants em dashes unspaced. Our house style spaces them, and the gap makes
# the clause break visible to a second-language reader instead of running
# two clauses together.
Microsoft.Dashes = NO
# Cognates and discourse connectives that L2 readers rely on, plus every
# "it is" -- which write-good counts as wordy but ASD-STE100 rule 4.2 requires,
# because the alternative is the contraction. The genuinely bureaucratic ones
# get fixed by hand.
write-good.TooWordy = suggestion

# ASD-STE100 rule 8.1 does not permit the semicolon at all: it makes long
# sentences possible and is hard to use correctly. Microsoft ships this rule at
# suggestion; we raise it, but not to error -- the remaining hits are inside
# the config reference, where "* `key` - what it does; defaults to X" is a
# table row in prose clothing rather than a sentence.
Microsoft.Semicolon = warning
